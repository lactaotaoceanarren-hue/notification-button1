<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Styled Notification Button</title>
<style>
  :root {
    --primary-color: #6366f1;
    --primary-hover: #4f46e5;
    --bg-color: #0f172a;
    --card-bg: #1e293b;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --border-color: #334155;
  }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }

  h1 {
    font-weight: 600;
    font-size: 1.5rem;
    margin-bottom: 24px;
    letter-spacing: -0.025em;
    background: linear-gradient(to right, #818cf8, #38bdf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }


  .notification-wrapper {
    position: relative;
    display: inline-block;
  }

  
  .notification {
    background-color: var(--card-bg);
    color: var(--text-main);
    text-decoration: none;
    padding: 12px 22px;
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    border-radius: 12px;
    cursor: pointer;
    border: 1px solid var(--border-color);
    font-size: 14px;
    font-weight: 500;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
    transition: all 0.2s ease;
  }

  .notification:hover {
    background-color: #273548;
    border-color: #475569;
    transform: translateY(-1px);
    box-shadow: 0 6px 12px -2px rgba(0, 0, 0, 0.2);
  }

  .notification:active {
    transform: translateY(0);
  }

 
  .notification .badge {
    position: absolute;
    top: -8px;
    right: -8px;
    padding: 3px 8px;
    border-radius: 9999px;
    background-color: #f43f5e;
    color: white;
    font-size: 11px;
    font-weight: 700;
    box-shadow: 0 0 0 3px var(--bg-color);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

 
  .notification-dropdown {
    display: none; 
    position: absolute;
    right: 0;
    top: 55px;
    background-color: var(--card-bg);
    min-width: 300px;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
    border: 1px solid var(--border-color);
    border-radius: 14px;
    z-index: 50;
    overflow: hidden;
    animation: fadeIn 0.2s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .dropdown-header {
    padding: 14px 18px;
    background-color: rgba(30, 41, 59, 0.7);
    font-weight: 600;
    font-size: 13px;
    color: var(--text-main);
    border-bottom: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .dropdown-header span {
    background-color: rgba(99, 102, 241, 0.15);
    color: #818cf8;
    padding: 2px 8px;
    border-radius: 99px;
    font-size: 11px;
  }

  .notification-item {
    padding: 14px 18px;
    font-size: 13px;
    color: var(--text-muted);
    border-bottom: 1px solid rgba(51, 65, 85, 0.4);
    text-decoration: none;
    display: block;
    transition: background-color 0.15s ease, color 0.15s ease;
  }

  .notification-item:hover {
    background-color: rgba(51, 65, 85, 0.4);
    color: var(--text-main);
  }

  .notification-item:last-child {
    border-bottom: none;
  }

  .notification-item strong {
    color: var(--text-main);
    display: block;
    margin-bottom: 2px;
    font-weight: 500;
  }
</style>
</head>
<body>

<h1>Notification Center Component</h1>

>
<div class="notification-wrapper">
  <button id="notifBtn" class="notification">

    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
    <span>Inbox</span>
    <span class="badge">3</span>
  </button>

 
  <div id="notifDropdown" class="notification-dropdown">
    <div class="dropdown-header">
      Notifications <span>3 new</span>
    </div>
    <a href="#" class="notification-item">
      <strong>New message</strong>
      Sarah sent you a direct message.
    </a>
    <a href="#" class="notification-item">
      <strong>Order Shipped</strong>
      Your recent package is on the way.
    </a>
    <a href="#" class="notification-item">
      <strong>Security Update</strong>
      Password successfully updated.
    </a>
  </div>
</div>

<script>
  const notifBtn = document.getElementById('notifBtn');
  const notifDropdown = document.getElementById('notifDropdown');

 
  notifBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    if (notifDropdown.style.display === 'block') {
      notifDropdown.style.display = 'none';
    } else {
      notifDropdown.style.display = 'block';
    }
  });

 
  window.addEventListener('click', function() {
    if (notifDropdown.style.display === 'block') {
      notifDropdown.style.display = 'none';
    }
  });
</script>

</body>
</html>
